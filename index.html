<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHR using async await</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-2">
                <h1 class="mt-4 text-center"><strong>Add Post Form</strong></h1>
                <form class="formpost mb-3 " id="postForm">
                    <div class="card">
                        <div class="form-group">
                            <div class="card-body">
                                <label for="title">POST TITLE</label>
                                <input class="form-control mb-1" type="text" placeholder="Post Title" id="title" required>
                                <label for="content">POST CONTENT</label>
                                <textarea class="form-control mb-1" rows="4" id="content"
                                    placeholder="Add Post Content Here...." required></textarea>
                                <label for="userID">User_ID</label>
                                <select class="form-control mb-2" id="userID">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                                <div class="form-group">
                                    <button type="submit" class="btn btn-info btn-block mb-1" id="addPostbtn">Add Post</button>
                                    <button type="button" class="btn btn-info btn-block d-none mb-1" id="updatePostbtn">Update
                                        Post</button>
                                    <button type="button" class="btn btn-warning btn-block" id="reset">Reset</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <main class="mainSection">
        <div class="container">
            <div class="row" id="showData">
                
            </div>
        </div>
    </main>



    <div class="loader d-none" id="loader">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
